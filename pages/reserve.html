<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>رزرو جلسه | Zaribafan</title>
    <link rel="stylesheet" href="/css/reserve.css" />
  </head>
  <body>

    <header class="header">
      <div class="container">
        <div class="logo">Zaribafan</div>
        <nav class="nav">
          <a href="/index.html">خانه</a>
          <a href="#">مقالات</a>
          <a href="/pages/about.html">درباره ما</a>
          <a href="/pages/education.html">آموزش‌ها</a>
          <a href="#">ارتباط با ما</a>
        </nav>
      </div>
    </header>

    <!-- فقط این بخش اضافه شده -->
    <main class="reserve-section">
      <div class="container">
        <h1 class="reserve-title">رزرو جلسه کوچینگ</h1>

        <form class="reserve-form">
          <div class="form-group">
            <label>نام</label>
            <input type="text" required />
          </div>

          <div class="form-group">
            <label>نام خانوادگی</label>
            <input type="text" required />
          </div>

          <div class="form-group">
            <label>شماره تماس</label>
            <input type="tel" required />
          </div>

          <div class="form-group">
            <label>ایمیل</label>
            <input type="email" />
          </div>

          <div class="form-group">
            <label>انتخاب روز جلسه</label>
            <input type="date" id="datePicker" required />
            <small>شنبه و چهارشنبه قابل رزرو نیستند</small>
          </div>

          <div class="form-group">
            <label>انتخاب ساعت</label>
            <select required>
              <option value="">انتخاب کنید</option>
              <option>10:00 - 11:00</option>
              <option>12:00 - 13:00</option>
              <option>15:00 - 16:00</option>
              <option>17:00 - 18:00</option>
            </select>
          </div>

          <button type="submit">ثبت رزرو</button>
        </form>
      </div>
    </main>
    <!-- پایان بخش جدید -->

    <footer class="footer">
      <p id="clock"></p>
      <p id="date"></p>
      <div class="social">
        <a href="#"><img src="/Assets/image/linkedin-logo-6.png" alt="لینکدین"></a>
        <a href="#"><img src="/Assets/image/telegram-logo.png" alt="تلگرام" /></a>
        <a href="#"><img src="/Assets/image/instagram-logo.jpg" alt="اینستاگرام" /></a>
      </div>

      <h2>لینک‌های مفید</h2>
      <ul class="links">
        <li>
          <a href="http://bciut.ir/" target="_blank">مؤسسه مربیگری دانشگاه تهران</a>
        </li>
        <li><a href="#" target="_blank">فدراسیون بین‌المللی مربیگری</a></li>
      </ul>
      <p>© تمامی حقوق محفوظ است</p>
    </footer>

    <script src="/js/reserve.js"></script>
  </body>
</html>
